syntax = "proto3";

package mainp;

option go_package = "example/log-scanner-grpc/pkg";

service LogScanner {
    rpc Search(SearchRequest) returns (stream SearchResponse);
}

message SearchRequest {
    string path = 1;
    string pattern = 2;
}

message SearchResponse {
    string file=1;
    int32  lineNumber = 2;
    string content = 3;
}